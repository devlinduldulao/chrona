name: Release

# Publishes on a v* tag, with provenance, via npm trusted publishing. No
# NPM_TOKEN: the registry trusts this workflow's OIDC identity, so there is no
# long-lived credential in the repository to leak or rotate.
#
# Configure the trusted publisher once per package, in each package's npm
# settings, naming this repository and this workflow file. That cannot be done
# before a package exists, so 0.1.0 was published manually to bootstrap it;
# CONTRIBUTING.md records the sequence.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs Node >=22.14 and npm >=11.5.1.
          node-version: 24
          # No registry-url on purpose. It makes setup-node write
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into the job's
          # npmrc, and this workflow deliberately has no NODE_AUTH_TOKEN, so npm
          # sends an empty credential, takes 404 from the registry, and never
          # attempts the OIDC exchange. registry.npmjs.org is npm's default
          # anyway; leaving auth unconfigured is what lets trusted publishing run.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package versions
        run: node scripts/verify-release.mjs "${{ github.ref_name }}"

      - run: pnpm check

      # Temporary, for the 0.2.0 publish: the registry answers 404 and the log
      # shows no OIDC exchange at all, so this reports which precondition is
      # missing. Presence only, never values — this repository is public and
      # these are credentials.
      - name: Diagnose publishing credentials
        run: |
          set -u
          state() { [ -n "${1:-}" ] && echo set || echo unset; }
          echo "node $(node --version), npm $(npm --version) (trusted publishing needs npm >= 11.5.1)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $(state "${ACTIONS_ID_TOKEN_REQUEST_URL:-}")"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: $(state "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}")"
          echo "NPM_CONFIG_USERCONFIG: ${NPM_CONFIG_USERCONFIG:-unset}"
          if [ -f "${NPM_CONFIG_USERCONFIG:-/nonexistent}" ]; then
            echo "--- userconfig npmrc, every value masked ---"
            sed 's/=.*/=<masked>/' "$NPM_CONFIG_USERCONFIG"
            echo "--- end ---"
          fi

          # Ask the registry directly whether it accepts this job's identity for
          # the package, and print the subject npm matches a trusted publisher
          # against. The id token and any returned credential stay unprinted.
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "$id_token" | python3 -c '
import base64, json, sys
payload = sys.stdin.read().strip().split(".")[1]
claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
for name in ("sub", "repository", "environment", "workflow_ref"):
    print(f"  {name}: {claims.get(name)}")
'
          for package in chrona-core chrona-react; do
            status=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$package" \
              -H "Authorization: Bearer $id_token" -H "Content-Type: application/json")
            echo "$package exchange: HTTP $status"
            python3 -c '
import json, sys
body = json.load(open("/tmp/exchange.json"))
print("  registry says:", body.get("message") or body.get("error") or f"keys={sorted(body)}")
' 2>/dev/null || echo "  registry returned a non-JSON body"
          done

      # pnpm packs, npm publishes. pnpm rewrites the workspace: protocol to real
      # versions at pack time but has no OIDC support; npm has OIDC but would
      # publish the workspace: specifier verbatim and break every consumer.
      - name: Pack
        run: |
          pnpm --filter chrona-core pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm --filter chrona-react pack --pack-destination "$RUNNER_TEMP/packs"

      # Core first: chrona-react depends on it. Skipping versions already on the
      # registry keeps a re-run, or a moved tag, from failing the release over
      # work that is in fact already done.
      - name: Publish
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          publish() {
            name="$1"
            tarball="$2"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
            else
              npm publish "$tarball" --access public --provenance
            fi
          }
          publish chrona-core "$RUNNER_TEMP"/packs/chrona-core-*.tgz
          publish chrona-react "$RUNNER_TEMP"/packs/chrona-react-*.tgz
