name: Release

# Publishes on a v* tag. Provenance requires this to run in CI with an OIDC
# token, so releases are not published from a maintainer's machine.
#
# The first publish of a package has to be token-authenticated: npm only lets
# you configure a trusted publisher from an existing package's settings, so a
# package that has never been published cannot have one. Once 0.1.0 is on the
# registry, add the trusted publisher for each package and drop NPM_TOKEN.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Provenance needs Node >=22.14 and npm >=11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package versions
        run: node scripts/verify-release.mjs "${{ github.ref_name }}"

      - run: pnpm check

      # Order matters: @chrona/react depends on @chrona/core via the workspace
      # protocol, which pnpm rewrites to the real version at pack time.
      - name: Publish @chrona/core
        run: pnpm --filter @chrona/core publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @chrona/react
        run: pnpm --filter @chrona/react publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
