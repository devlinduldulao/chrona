name: Release

# Publishes on a v* tag, with provenance.
#
# This used npm trusted publishing and could not: GitHub issues an *immutable*
# OIDC subject for repositories created after 2026-07-15 —
# `repo:devlinduldulao@22025912/chrona@1374885228:environment:release` — and the
# registry only matches the legacy `repo:<owner>/<repo>:...` form. The token
# exchange returns 201 because it matches on the `repository` claim; the upload
# is then refused with `403 OIDC permission denied for this action`. That is
# npm/cli#9969, it is open, and the repository setting that would turn immutable
# subjects off accepts a PUT and keeps its old value, so there is nothing to fix
# on this side. See CONTRIBUTING.md before reopening this.
#
# So: a granular npm token in the NPM_TOKEN secret, scoped to these two packages
# only, with trusted publishing disabled through NPM_ID_TOKEN rather than by
# hiding GitHub's OIDC variables — see the Publish step. That distinction is what
# keeps provenance, which is signed through those same variables. When
# npm/cli#9969 closes, drop the token, `registry-url`, `NODE_AUTH_TOKEN` and
# `NPM_ID_TOKEN`, and delete the secret; provenance then comes for free.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release for the tag
  id-token: write # provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Required for token auth: it writes
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into the job's
          # npmrc. The old rule against it held only while this workflow had no
          # token to put there, which left npm sending an empty credential.
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile

      # A missing secret otherwise surfaces as ENEEDAUTH after a full build.
      - name: Require a publish credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set. Create a granular npm token with read and write on chrona-core and chrona-react, then add it to this repository's 'release' environment. CONTRIBUTING.md has the steps."
            exit 1
          fi

      - name: Verify the tag matches the package versions
        run: node scripts/verify-release.mjs "${{ github.ref_name }}"

      - run: pnpm check

      # pnpm packs, npm publishes. pnpm rewrites the workspace: protocol to real
      # versions at pack time but has no publish auth; npm has the auth but would
      # publish the workspace: specifier verbatim and break every consumer.
      - name: Pack
        run: |
          pnpm --filter chrona-core pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm --filter chrona-react pack --pack-destination "$RUNNER_TEMP/packs"

      # Core first: chrona-react depends on it. Skipping versions already on the
      # registry keeps a re-run, or a moved tag, from failing the release over
      # work that is in fact already done.
      # npm 11.5+ attempts trusted publishing whenever GitHub's OIDC variables are
      # in the environment, and here the token exchange *succeeds* — it is the
      # upload that is refused — so npm settles on the OIDC credential and never
      # reaches the token in the npmrc. The variables have to be *unset*, not
      # emptied, for npm to fall back. Provenance reads the same pair, so it
      # cannot be signed either way; it comes back with trusted publishing when
      # npm/cli#9969 closes. The echo makes a repeat of this unmistakable.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm asks the registry to trade a GitHub id token for a publish
          # credential before it ever reads the npmrc, and here that trade
          # *succeeds* — only the upload is refused (npm/cli#9969) — so npm
          # settles on a credential the registry will then reject.
          #
          # `oidc()` takes its id token from NPM_ID_TOKEN in preference to asking
          # GitHub for one, and returns quietly when the exchange fails, leaving
          # whatever is in the npmrc alone. A deliberately invalid value therefore
          # disables trusted publishing and nothing else.
          #
          # Unsetting ACTIONS_ID_TOKEN_REQUEST_* disables it too, but provenance is
          # signed through that same pair, so doing it that way costs the
          # attestation. This keeps the pair intact for signing and sabotages only
          # the auth path. Delete this variable when npm/cli#9969 closes.
          NPM_ID_TOKEN: trusted-publishing-disabled-see-npm-cli-9969
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          publish() {
            name="$1"
            tarball="$2"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
            else
              npm publish "$tarball" --access public --provenance
            fi
          }
          publish chrona-core "$RUNNER_TEMP"/packs/chrona-core-*.tgz
          publish chrona-react "$RUNNER_TEMP"/packs/chrona-react-*.tgz

      # A green run that skipped both packages is not a release. Prove the
      # versions are actually on the registry before calling it done — but npm's
      # publish pipeline is asynchronous ("your package is being processed"), so
      # a single immediate read fails a release that in fact succeeded. Poll.
      - name: Confirm the registry has them
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for name in chrona-core chrona-react; do
            for attempt in $(seq 1 30); do
              if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
                echo "$name@$version is published."
                continue 2
              fi
              sleep 10
            done
            echo "::error::$name@$version did not appear on the registry within five minutes."
            exit 1
          done
          # Provenance is the reason this workflow jumps through the hoop above, so
          # prove the attestation is really attached rather than assuming it. This
          # endpoint lags the version endpoint, which lags the publish, so it gets
          # the same patience: reading it once failed 0.3.4 over an attestation
          # that was there a minute later.
          for name in chrona-core chrona-react; do
            for attempt in $(seq 1 30); do
              if curl -fsS "https://registry.npmjs.org/-/npm/v1/attestations/$name@$version" 2>/dev/null | grep -q '"attestations"'; then
                echo "$name@$version carries a provenance attestation."
                continue 2
              fi
              sleep 10
            done
            echo "::error::$name@$version has no provenance attestation after five minutes."
            exit 1
          done

      # A pushed tag is not a release page. Everything after 0.1.0 was tag-only
      # because nothing here created one; the notes come from the changelogs so
      # the page and the published packages cannot drift apart.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a GitHub Release; leaving it alone."
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "Chrona $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
